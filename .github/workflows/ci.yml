name: CI

on: 
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "*.slnx"
  push:
    tags-ignore:
      - "*"
  workflow_dispatch: 

env:
  DOTNET_VERSION: 10.0.x

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print Environment Variables
        shell: pwsh
        run: |
          Get-ChildItem Env: | ForEach-Object {Write-Host "$($_.Name)=$($_.Value)"}

      - name: Setup Dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{env.DOTNET_VERSION}}

      - name: Dotnet Version
        run: dotnet --version

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --logger trx --collect "Code coverage" --results-directory ${{runner.temp}}/results

      - name: Publish Results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: success() || failure()
        with:
          name: test-results
          path: ${{runner.temp}}/results/*.trx
          reporter: dotnet-trx
          fail-on-empty: false